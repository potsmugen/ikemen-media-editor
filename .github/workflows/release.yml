# Rebuilds the single "latest" release on every push to main.
# Version = UTC date; About shows date+commit so same-day builds differ.
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'agents/**']
  workflow_dispatch:

# A newer push supersedes a build still in progress.
concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - id: v
        run: |
          echo "version=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          # Windows host needed for the exe icon and no-console subsystem.
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          # Mac host ad-hoc signs the binary, which Apple Silicon requires.
          - rid: osx-arm64
            os: macos-latest
          - rid: osx-x64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        shell: bash
        run: >
          dotnet publish src/Editor -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true
          -p:Version=${{ needs.version.outputs.version }}
          -p:InformationalVersion=${{ needs.version.outputs.version }}+${{ needs.version.outputs.sha }}
          -o out/${{ matrix.rid }}
      - name: Package (zip)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: Compress-Archive -Path out/${{ matrix.rid }}/* -DestinationPath ikemen-media-editor-${{ matrix.rid }}.zip
      # tar keeps the executable bit, which zip loses.
      - name: Package (tar.gz)
        if: matrix.rid != 'win-x64'
        run: tar -czf ikemen-media-editor-${{ matrix.rid }}.tar.gz -C out/${{ matrix.rid }} .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: ikemen-media-editor-${{ matrix.rid }}.*

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Replace the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/* \
            --target "$GITHUB_SHA" \
            --title "$VERSION ($SHA)" \
            --notes "Built from ${GITHUB_SHA} on ${VERSION}. macOS builds are untested; reports welcome." \
            --latest
